<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#8b5cf6;#00d4ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#00d4ff;#8b5cf6" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="120" cy="120" r="105" />
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ring {
        fill: none;
        stroke: url(#gradient);
        stroke-width: 8;
        transform-origin: 120px 120px;
        animation: rotate 6s linear infinite;
        filter: url(#glow);
      }
      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Glowing Animated Border -->
  <circle cx="120" cy="120" r="110" class="ring" />
  
  <!-- Profile Picture -->
  <image x="15" y="15" width="210" height="210" href="https://raw.githubusercontent.com/GarvitGoel04/portfolio/main/Profile_pic.jpeg" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" />
</svg>
